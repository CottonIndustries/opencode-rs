# BoringSSL (via wreq/btls-sys) is built from source: bindgen needs libclang and the build needs
# CMake and NASM. Point these at your own installs if they live elsewhere.
[env]
LIBCLANG_PATH = { value = ".tools/libclang", relative = true }
CMAKE = "C:/Program Files/Microsoft Visual Studio/18/Professional/Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/cmake.exe"
ASM_NASM = { value = ".tools/nasm/nasm.exe", relative = true }

# Link the MSVC C/C++ runtime statically so the exe runs without the VC++ Redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
