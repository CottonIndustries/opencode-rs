[workspace]
members = [
    "crates/opencode-foundation",
    "crates/opencode-storage",
    "crates/opencode-services",
    "crates/opencode-core",
    "crates/opencode-tui",
    "crates/opencode-server",
]
default-members = [
    ".",
    "crates/opencode-foundation",
    "crates/opencode-storage",
    "crates/opencode-services",
    "crates/opencode-core",
    "crates/opencode-tui",
    "crates/opencode-server",
]
resolver = "2"

[package]
name = "opencode"
version = "2.2.7"
edition = "2021"
description = "OpenCode - AI coding agent for the terminal (Rust rewrite)"
license = "MIT"

[[bin]]
name = "opencode"
path = "src/main.rs"

[dependencies]
opencode-core = { path = "crates/opencode-core" }
opencode-tui = { path = "crates/opencode-tui" }
opencode-server = { path = "crates/opencode-server" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
flate2 = "1"
futures = "0.3"
globset = "0.4"
htmd = "0.1"
html2text = "0.12"
ignore = "0.4"
mime_guess = "2"
portable-pty = "0.9"
pulldown-cmark = { version = "0.12", default-features = false }
rand = "0.8"
ratatui = "0.29"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha1_smol = "1"
http = "1"
url = "2"
wreq = { version = "0.16.1", default-features = false, features = ["tokio-rt", "webpki-roots", "json", "stream", "multipart", "gzip", "deflate", "brotli", "zstd", "ws"] }
wreq-proto = "0.2.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
similar = { version = "2", features = ["inline"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
unicode-width = "0.2"
vt100 = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
