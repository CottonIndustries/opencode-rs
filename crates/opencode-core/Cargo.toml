[package]
name = "opencode-core"
version = "2.2.7"
edition = "2021"
description = "Core runtime for OpenCode - AI coding agent for the terminal"
license = "MIT"

[dependencies]
opencode-foundation = { path = "../opencode-foundation" }
opencode-services = { path = "../opencode-services" }
opencode-storage = { path = "../opencode-storage" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
flate2 = "1"
futures = "0.3"
globset = "0.4"
htmd = "0.1"
html2text = "0.12"
ignore = "0.4"
mime_guess = "2"
portable-pty = "0.9"
rand = "0.8"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha1_smol = "1"
http = "1"
url = "2"
wreq = { version = "0.16.1", default-features = false, features = ["tokio-rt", "webpki-roots", "json", "stream", "multipart", "gzip", "deflate", "brotli", "zstd", "ws"] }
wreq-proto = "0.2.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hmac = "0.12"
similar = { version = "2", features = ["inline"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
unicode-width = "0.2"
vt100 = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
