[package]
name = "opencode-storage"
version = "2.2.7"
edition = "2021"
description = "Durable sessions, events, snapshots and media for OpenCode"
license = "MIT"

[dependencies]
opencode-foundation = { path = "../opencode-foundation" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1_smol = "1"
sha2 = "0.10"
similar = { version = "2", features = ["inline"] }
url = "2"
